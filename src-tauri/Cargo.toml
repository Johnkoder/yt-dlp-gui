[package]
name = "yt-dlp-gui"
version = "0.1.0"
description = "Windows desktop GUI for yt-dlp"
edition = "2021"
# Floor is driven by the dependency tree (plist/time/serde_with require
# 1.88); this also covers the `reason = "..."` lint syntax (needs 1.81+).
rust-version = "1.88"

[lib]
name = "yt_dlp_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
